<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Westlands Hero Forge</title>
  <meta name="description" content="Create heroes for Tolkien-inspired tabletop adventures.">
  <!-- Installable, and playable offline once opened (see tools/sw-template.js). -->
  <link rel="manifest" href="assets/app/manifest.webmanifest">
  <meta name="theme-color" content="#3a2412">
  <link rel="icon" href="assets/app/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hero Forge">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The fonts travel with the game, so it looks the same with no connection. -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <script>try { const t = localStorage.getItem('rpg.theme'); if (t === 'light' || t === 'dark') { document.documentElement.dataset.theme = t; document.documentElement.dataset.themeByGame = '1'; } } catch {}</script>
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <div id="app"><noscript>This game needs JavaScript enabled.</noscript></div>
  <div class="offline-toast" role="status" aria-live="polite" hidden></div>
  <script>
    // Store the whole game on this device for offline play (only where the build made sw.js).
    if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
      const toast = (text) => {
        const t = document.querySelector('.offline-toast'); if (!t) return;
        t.textContent = text; t.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 6000);
      };
      // Was an older copy already running this page? Then a new version is an update to switch to.
      const hadCopy = !!navigator.serviceWorker?.controller;
      navigator.serviceWorker?.addEventListener('message', (e) => {
        if (e.data?.type !== 'offline-ready') return;
        const first = !localStorage.getItem('rpg.offline');
        const prev = localStorage.getItem('rpg.offline');
        try { localStorage.setItem('rpg.offline', e.data.version); } catch {}
        if (first || !hadCopy || prev === e.data.version) { toast('✓ Saved for offline play: the game now works with no connection.'); return; }
        // An update. Off the board, switch at once; in the middle of an adventure, offer a button
        // (the adventure is saved after every fight, so loading the new version loses little).
        if (!document.querySelector('.dg-viewport')) { location.reload(); return; }
        const t = document.querySelector('.offline-toast'); if (!t) return;
        clearTimeout(toast.timer); t.hidden = false;
        t.innerHTML = 'A new version of the game is ready. <button class="btn small primary" type="button">Load it now</button>';
        t.querySelector('button').onclick = () => location.reload();
      });
      window.addEventListener('load', () => {
        fetch('sw.js', { method: 'HEAD' }).then((r) => {
          if (!r.ok) return;
          navigator.serviceWorker.register('sw.js').then((reg) => {
            // Look for a new version whenever the game comes back to the screen (phones keep apps
            // open for days), and every half hour while it is open.
            const check = () => reg.update().catch(() => {});
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
            setInterval(check, 30 * 60 * 1000);
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
